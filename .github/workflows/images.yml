name: Images

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - Dockerfile.webapp
      - initdb/**
      - .github/workflows/images.yml
  schedule:
    # The webapp follows repology-rs, which has no releases; the database
    # pins everything it builds and only needs its base image refreshed.
    - cron: "30 5 * * *"
    - cron: "0 4 1 * *"
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild the webapp even if repology-rs has not moved
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  webapp:
    if: github.event_name != 'schedule' || github.event.schedule == '30 5 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # A scheduled run rebuilds only when upstream moved: the published image
      # records the commit it was built from, so comparing the two costs one
      # registry lookup instead of a 20-minute Rust build.
      - name: Decide whether to build
        id: check
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/repology-webapp:latest
        run: |
          upstream=$(git ls-remote https://github.com/repology/repology-rs.git refs/heads/master | cut -f1)
          published=$(docker buildx imagetools inspect "$IMAGE" \
            --format '{{ index .Image.Config.Labels "org.opencontainers.image.revision" }}' 2>/dev/null || true)
          echo "upstream=$upstream" >> "$GITHUB_OUTPUT"
          echo "upstream $upstream / published ${published:-none}"
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$upstream" != "$published" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v4
        if: steps.check.outputs.build

      - uses: docker/login-action@v4
        if: steps.check.outputs.build
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # amd64 only: rustc segfaults under QEMU, and the runner is amd64 anyway.
      - uses: docker/build-push-action@v7
        if: steps.check.outputs.build
        with:
          context: .
          file: Dockerfile.webapp
          platforms: linux/amd64
          build-args: REPOLOGY_RS_REF=${{ steps.check.outputs.upstream }}
          # image.source is what links the package back to this repository, and
          # with it the write access this workflow's token needs.
          labels: |
            org.opencontainers.image.revision=${{ steps.check.outputs.upstream }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: ghcr.io/${{ github.repository_owner }}/repology-webapp:latest
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  database:
    if: github.event_name != 'schedule' || github.event.schedule == '0 4 1 * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: ghcr.io/${{ github.repository_owner }}/repology-mirror-db:latest
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
